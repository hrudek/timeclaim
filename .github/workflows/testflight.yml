name: TestFlight

# Every push to main (and on demand): Expo prebuild, signed archive, upload to
# App Store Connect for TestFlight. Build number = run number.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_ID: ${{ vars.APPLE_CERTIFICATE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install certificate and API key
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Provisioning profile
        run: |
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            python3 .github/testflight/profiles.py

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios

      - name: Configure manual signing for the app target
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open(Dir['ios/*.xcodeproj'].first)
          target = project.targets.find { |t| t.product_type == 'com.apple.product-type.application' }
          profile = File.read(File.join(ENV['RUNNER_TEMP'], 'profile-name.txt'))
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings['DEVELOPMENT_TEAM'] = ENV['APPLE_TEAM_ID']
            c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile
            c.build_settings['CURRENT_PROJECT_VERSION'] = ENV['BUILD_NUMBER']
          end
          project.save
          puts "Configured target #{target.name}"
          RUBY

      - name: Archive
        run: |
          xcodebuild -version | head -n 1
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TimeClaim.xcarchive" \
            > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E ' error: |BUILD FAILED' "$RUNNER_TEMP/archive.log" | sort -u | head -n 80; exit 1; }

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TimeClaim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" | tail -n 20

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' \
            "$RUNNER_TEMP/TimeClaim.xcarchive/Info.plist")
          echo "Uploaded TimeClaim $version ($BUILD_NUMBER) to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/certificate.p12"
