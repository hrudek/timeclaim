name: Build

# Every push to main that touches the app (and on demand): test builds for both
# platforms. Pushes that only change documentation (Markdown, docs/) skip it.
# iOS goes to TestFlight (internal testers only), the Android APK becomes the
# GitHub pre-release "build-<n>". Nothing reaches users until a v* tag is
# pushed (see release.yml). Build number = Android versionCode = run number.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_ID: ${{ vars.APPLE_CERTIFICATE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install certificate and API key
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Provisioning profile
        run: |
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            python3 .github/testflight/profiles.py

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios

      - name: Configure manual signing for the app target
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open(Dir['ios/*.xcodeproj'].first)
          target = project.targets.find { |t| t.product_type == 'com.apple.product-type.application' }
          profile = File.read(File.join(ENV['RUNNER_TEMP'], 'profile-name.txt'))
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings['DEVELOPMENT_TEAM'] = ENV['APPLE_TEAM_ID']
            c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile
          end
          project.save
          puts "Configured target #{target.name}"
          RUBY

      - name: Archive
        run: |
          xcodebuild -version | head -n 1
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TimeClaim.xcarchive" \
            > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E ' error: |BUILD FAILED' "$RUNNER_TEMP/archive.log" | sort -u | head -n 80; exit 1; }

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TimeClaim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" | tail -n 20

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' \
            "$RUNNER_TEMP/TimeClaim.xcarchive/Info.plist")
          echo "iOS: uploaded TimeClaim $version ($BUILD_NUMBER) to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/certificate.p12"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            > "$RUNNER_TEMP/gradle.log" 2>&1 \
            || { grep -E -A8 'What went wrong|error:|FAILED' "$RUNNER_TEMP/gradle.log" | head -n 80; exit 1; }

      - name: Verify signature
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          [ -n "$apksigner" ] || { echo "apksigner not found in $ANDROID_HOME/build-tools" >&2; exit 1; }
          certs=$("$apksigner" verify --print-certs "$apk" 2>&1) || { echo "$certs" >&2; exit 1; }
          # Every signer line (format differs by apksigner version) must show the upload key.
          digest=$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$digest" != "$ANDROID_CERT_SHA256" ]; then
            printf '%s\n' "$certs" | grep -v -i 'warning' >&2
            echo "APK is not signed with the upload key (got '$digest')." >&2
            exit 1
          fi
          version=$(node -p "require('./app.json').expo.version")
          mkdir -p "$RUNNER_TEMP/apk"
          mv "$apk" "$RUNNER_TEMP/apk/TimeClaim-$version-$BUILD_NUMBER.apk"
          echo "Android: built TimeClaim $version ($BUILD_NUMBER)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  publish:
    needs: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: apk

      - name: Create pre-release
        run: |
          apk=$(ls apk/*.apk)
          version=$(basename "$apk" .apk | cut -d- -f2)
          gh release create "build-$BUILD_NUMBER" "$apk" --target "$GITHUB_SHA" --prerelease \
            --title "Build $BUILD_NUMBER ($version)" \
            --notes "Test build of ${GITHUB_SHA:0:7}, not for users.

          - iOS: TestFlight build $version ($BUILD_NUMBER), internal testers.
          - Android: the APK below.

          Release this exact build to users:

          \`\`\`sh
          git tag v$version $GITHUB_SHA && git push origin v$version
          \`\`\`"
          echo "Pre-release: build-$BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the ten newest pre-releases
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.prerelease) | .tag_name' \
            | sort -t- -k2 -n -r | tail -n +11 \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
